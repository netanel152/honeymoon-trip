# פריסה אוטומטית: כל דחיפה ל-main בונה ומפרסמת את האתר.
# מפרסמים רק את dist/ — כדי שה-Word, האקסל וה-PDF-ים שבשורש לא ייחשפו לרשת.

[build]
  command  = "node build.mjs"
  publish  = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# ה-Service Worker חייב להיטען טרי, אחרת דפדפן שמחזיק גרסה ישנה
# לא יגלה לעולם שיצאה גרסה חדשה.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
